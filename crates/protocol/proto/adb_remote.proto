syntax = "proto3";

package adb_remote;

service AgentService {
  rpc AgentSession(stream AgentClientMessage) returns (stream AgentServerMessage);
}

service UserService {
  rpc ListDevices(ListDevicesRequest) returns (ListDevicesResponse);
  rpc AcquireLease(AcquireLeaseRequest) returns (AcquireLeaseResponse);
  rpc ReleaseLease(ReleaseLeaseRequest) returns (ReleaseLeaseResponse);
  rpc ProxyAdbStream(stream AdbProxyFrame) returns (stream AdbProxyFrame);
}

service AdminService {
  rpc ListServerDevices(AdminListDevicesRequest) returns (AdminListDevicesResponse);
  rpc ListServerLeases(AdminListLeasesRequest) returns (AdminListLeasesResponse);
  rpc ListAuditEvents(AdminListAuditEventsRequest) returns (AdminListAuditEventsResponse);
}

message DeviceRegistration {
  string display_name = 1;
  string adb_serial = 2;
  bool password_required = 3;
  repeated string tags = 4;
  string group = 5;
}

message AgentHello {
  string agent_id = 1;
  string hostname = 2;
  repeated DeviceRegistration devices = 3;
}

message Heartbeat {
  int64 unix_millis = 1;
}

message ValidatePasswordResult {
  string request_id = 1;
  string display_name = 2;
  bool valid = 3;
}

message AgentClientMessage {
  oneof payload {
    AgentHello hello = 1;
    Heartbeat heartbeat = 2;
    ValidatePasswordResult password_result = 3;
    AdbProxyFrame proxy_frame = 4;
  }
}

message ValidatePasswordRequest {
  string request_id = 1;
  string display_name = 2;
  string password = 3;
}

message AgentServerMessage {
  oneof payload {
    ValidatePasswordRequest password_request = 1;
    AdbProxyFrame proxy_frame = 2;
  }
}

message ListDevicesRequest {}

message DeviceInfo {
  string display_name = 1;
  string adb_serial = 2;
  bool password_required = 3;
  string state = 4;
  string leased_by = 5;
  string group = 6;
  repeated string tags = 7;
}

message ListDevicesResponse {
  repeated DeviceInfo devices = 1;
}

message AcquireLeaseRequest {
  string display_name = 1;
  string password = 2;
  string client_hostname = 3;
}

message AcquireLeaseResponse {
  bool granted = 1;
  string lease_id = 2;
  string error_code = 3;
  string message = 4;
  bool password_required = 5;
}

message ReleaseLeaseRequest {
  string lease_id = 1;
  string display_name = 2;
  string reason = 3;
}

message ReleaseLeaseResponse {
  bool released = 1;
  string error_code = 2;
  string message = 3;
}

message StreamOpen {
  string display_name = 1;
}

message StreamClose {
  string reason = 1;
}

message StreamError {
  string code = 1;
  string message = 2;
}

message AdbProxyFrame {
  string lease_id = 1;
  uint64 stream_id = 2;
  oneof payload {
    StreamOpen open = 3;
    bytes data = 4;
    StreamClose close = 5;
    StreamError error = 6;
  }
}

message AdminListDevicesRequest {}
message AdminListDevicesResponse {
  repeated DeviceInfo devices = 1;
}

message LeaseInfo {
  string lease_id = 1;
  string display_name = 2;
  string client_hostname = 3;
  string source = 4;
  int64 started_at_unix_millis = 5;
  uint64 bytes_from_user = 6;
  uint64 bytes_from_device = 7;
}

message AdminListLeasesRequest {}
message AdminListLeasesResponse {
  repeated LeaseInfo leases = 1;
}

message AuditEvent {
  int64 id = 1;
  string event_type = 2;
  string display_name = 3;
  string lease_id = 4;
  string source = 5;
  string reason = 6;
  uint64 bytes_from_user = 7;
  uint64 bytes_from_device = 8;
  int64 created_at_unix_millis = 9;
}

message AdminListAuditEventsRequest {
  uint32 limit = 1;
}

message AdminListAuditEventsResponse {
  repeated AuditEvent events = 1;
}
